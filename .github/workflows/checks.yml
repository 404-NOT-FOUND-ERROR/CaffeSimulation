name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check application syntax
        run: |
          for file in *.js *.mjs *.cjs; do node --check "$file"; done
