<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>这一杯，由你调 · 咖啡小馆</title><meta name="description" content="先用摩卡壶做咖啡液，再加料、搅拌、分杯比较，让制作与配方登上自己的意式特刊。"><link rel="stylesheet" href="recipe-lab.css"><link rel="stylesheet" href="coffee-fidelity.css"><link rel="stylesheet" href="reference-fidelity.css"><link rel="preload" as="image" href="assets/recipe-lab/corner-still-life.png"></head>
<body><main class="lab" id="lab" data-scene="recipe">
<div class="coffee-worktop" aria-hidden="true"></div><div class="coffee-atlas" aria-hidden="true"></div><div class="paper-grain" aria-hidden="true"></div><div class="poster-fragment" aria-hidden="true"><span>Più<br>Caffè<br>Più<br>Idee.</span><small>OGNI GIORNO<br>UN BUON GIORNO</small></div>
<img class="still-life" src="assets/recipe-lab/corner-still-life.png" alt="" aria-hidden="true" draggable="false"><div class="signoff" aria-hidden="true">Good Ideas<br><i>Taste Better.</i></div>
<header class="lab-header"><a id="backLink" href="studio.html">← 咖啡小馆</a><nav class="coffee-progress" aria-label="制作流程"><span>做基底</span><span class="current">调配</span><span>出品</span></nav><span id="backNote"></span><button id="resumeBrew" class="text-button" hidden>继续冲煮 ↗</button><button id="shelfButton" class="text-button">我的特刊 <span id="shelfCount"></span></button></header>
<section class="scene-layout" id="sceneLayout" aria-label="咖啡实验工作台">
<aside class="editorial"><h1 id="headline">这一杯，<br>由你调。</h1><p class="italian" id="italian">PICCOLI ESPERIMENTI</p><div class="paper-slip" id="orderSlip"></div><p class="left-note" id="leftNote"></p></aside>
<section class="hero" id="hero" aria-label="当前咖啡杯"></section><aside class="details" id="details" aria-label="当前配方与说明"></aside>
<section class="control-dock" id="controlDock" aria-label="当前操作"></section><section class="ingredient-tray" id="ingredientTray" aria-label="成分托盘"></section></section>
<section class="gazette-layout" id="gazetteLayout" aria-label="咖啡特刊编辑" hidden><aside class="gazette-aside"><h1>今天的小馆特刊</h1><p>好咖啡<br>让平凡的日子<br>有了特别的味道。</p><img src="assets/reference-room/assembled-moka.png" alt="本次制作使用摩卡壶"></aside><div class="gazette-preview"><canvas id="gazetteCanvas" width="1200" height="1800" aria-label="本期特刊，1200乘1800像素"></canvas></div>
<section class="gazette-editor"><h1>这一杯，值得一期。</h1><p class="gazette-intro">把真实配方，做成你的咖啡特刊。</p>
<label class="field-label">作品标题<input id="gazetteTitle" maxlength="20" autocomplete="off" placeholder="给这一期起个名字"></label>
<fieldset class="plain-fieldset layout-format"><legend>画面内容</legend><div id="gazetteLayouts" class="segments"></div></fieldset>
<fieldset class="plain-fieldset"><legend>配色</legend><div id="gazettePalettes" class="palette-options"></div></fieldset>
<fieldset class="plain-fieldset composition-options"><legend>版式选择</legend><div id="gazetteStyles" class="style-options"></div></fieldset>
<article id="gazetteRecord" class="gazette-record"></article><p class="fine">换构图与配色，配方保持不变。</p>
<div class="export-actions"><button class="primary" data-action="export">↓ 保存海报 PNG</button><button class="secondary" data-action="save-shelf">▱ 存入特刊册</button></div><div class="gazette-return"><button class="text-button" data-action="return-recipe">← 继续调配</button><a href="studio.html">接下一单 ↗</a></div>
<p class="fine">1200 × 1800 · 可保存图片</p><a id="exportLink" class="export-link" hidden target="_blank" rel="noopener">打开已保存的图片 ↗</a></section></section>
<p id="liveStatus" class="sr-only" role="status" aria-live="polite"></p></main>
<div id="labToast" class="lab-toast" role="status" aria-live="polite"></div>
<dialog id="shelfDialog" class="shelf-dialog"><button class="dialog-close" data-action="close-shelf" aria-label="关闭特刊册">×</button><p class="italian">IL MIO QUADERNO</p><h2>我的特刊册</h2><p class="fine">保存在当前浏览器，回到配方还能继续调整。</p><div id="savedEditions"></div></dialog>
<noscript>请启用 JavaScript，开始你的咖啡实验。</noscript><script type="module" src="recipe-lab.js"></script></body></html>
