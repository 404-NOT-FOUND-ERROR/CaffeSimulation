<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先做一锅 · 咖啡小馆</title><meta name="description" content="选择水位和研磨，观察摩卡壶出液；同时拆开教学模型了解结构，再用自己的咖啡基底自由调配。"><link rel="stylesheet" href="coffee-fidelity.css"><link rel="stylesheet" href="hybrid-workbench.css"></head>
<body><main class="workbench" id="workbench" data-page="prepare">
<div class="coffee-atlas" aria-hidden="true"></div><div class="coffee-worktop" aria-hidden="true"></div>
